apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-frontend
spec:
  replicas: 1
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # the old pod stays until the new one passes its readiness probe
  selector:
    matchLabels:
      app: portfolio-frontend
  template:
    metadata:
      labels:
        app: portfolio-frontend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: portfolio-frontend
          image: ghcr.io/aidenharwood/portfolio/frontend:38431049254-89
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop: # keep serving while Traefik drops this pod from its endpoints
              exec:
                command: ["sleep", "10"]
          env:
            - name: VITE_API_URL
              value: "https://api.aidenharwood.uk"
          # - name: NODE_OPTIONS
          #   value: --require @opentelemetry/auto-instrumentations-node/register
          # - name: OTEL_EXPORTER_OTLP_ENDPOINT
          #   value: http://lgtm-alloy.lgtm.svc.cluster.local:4318
