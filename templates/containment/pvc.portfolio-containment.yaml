# The SQLite database (accounts, sessions, characters). local-path volumes live on one node's disk
# and survive pod restarts and redeploys; the storage class deletes the data when the claim is
# deleted, so the claim is protected from being pruned or cascade-deleted by Argo CD or Helm.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portfolio-containment-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
