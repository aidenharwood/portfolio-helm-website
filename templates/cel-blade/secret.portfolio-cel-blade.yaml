{{- $secretName := .Values.celBlade.secret.name | default "portfolio-cel-blade" -}}
{{- $postgresPassword := .Values.celBlade.secret.postgresPassword | default (randAlphaNum 24) -}}
{{- $internalKey := .Values.celBlade.secret.internalKey | default (randAlphaNum 24) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/part-of: cel-blade
type: Opaque
stringData:
  postgres-password: {{ $postgresPassword | quote }}
  internal-key: {{ $internalKey | quote }}
