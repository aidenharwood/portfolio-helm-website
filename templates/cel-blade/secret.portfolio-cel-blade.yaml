{{- $secretName := "portfolio-cel-blade" -}}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $postgresPassword := "" -}}
{{- $internalKey := "" -}}

{{- if $secret -}}
  {{- $postgresPassword = index $secret.data "postgres-password" | b64dec -}}
  {{- $internalKey = index $secret.data "internal-key" | b64dec -}}
{{- else -}}
  {{- $postgresPassword = randAlphaNum 24 -}}
  {{- $internalKey = randAlphaNum 24 -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/part-of: cel-blade
type: Opaque
stringData:
  postgres-password: {{ $postgresPassword | quote }}
  internal-key: {{ $internalKey | quote }}
